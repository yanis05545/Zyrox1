name: Build APK + ZIP Modul

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Gabungkan APK ke zip modul
        run: bash tools/pack_module.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Azenith-AI-APK
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Azenith-AI-Module-ZIP
          path: dist/*.zip
